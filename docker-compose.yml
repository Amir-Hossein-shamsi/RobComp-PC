services:
  mysql:
    image: mysql:8.4
    container_name: dadkavan_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "6206:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dadkavan_net

  redis:
    image: redis:7-alpine
    container_name: dadkavan_redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$REDIS_PASSWORD\" ]; then redis-server --requirepass \"$REDIS_PASSWORD\"; else redis-server; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6204:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dadkavan_net

  django:
    build:
      context: .
      dockerfile: Docker/django.Dockerfile
    container_name: dadkavan_django
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:6280 --workers 3"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "6280"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dadkavan_net

  fastapi:
    build:
      context: .
      dockerfile: Docker/fastapi.Dockerfile
    container_name: dadkavan_fastapi
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 6288 --workers 2
    # gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4000 --workers 2 --timeout 120 app:app"
    expose:
      - "6288"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - media_data:/app/media   
    networks:
      - dadkavan_net

  worker_a:
    build:
      context: .
      dockerfile: Docker/worker.Dockerfile
    container_name: dadkavan_worker_a
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    command: python -m workers.websocket_workerA
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dadkavan_net

  worker_b:
    build:
      context: .
      dockerfile: Docker/worker.Dockerfile
    container_name: dadkavan_worker_b
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    command: python -m workers.redis_workerB
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - dadkavan_net

  nginx:
    image: nginx:alpine
    container_name: dadkavan_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - django
      - fastapi
    networks:
      - dadkavan_net

networks:
  dadkavan_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  static_data:
  media_data: